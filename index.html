<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 2분기</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h2 {
            margin-bottom: 10px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
            border: 1px solid #ddd;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            max-width: 400px;
        }

        .cell {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background-color: #e0e0e0; /* 기본 회색 */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: rgba(0,0,0,0.4);
            user-select: none;
            transition: transform 0.1s, filter 0.1s;
        }

        .cell:active {
            transform: scale(0.9);
        }

        /* 색상 클래스 */
        .state-0 { background-color: #e0e0e0; color: rgba(0,0,0,0.4); } /* 회색 */
        .state-1 { background-color: #4caf50; color: white; } /* 초록색 */
        .state-2 { background-color: #f44336; color: white; } /* 빨간색 */
        .state-3 { background-color: #212121; color: white; } /* 검은색 */
        .state-4 { background-color: #ff9800; color: white; } /* 주황색 */
        .state-5 { background-color: #ffeb3b; color: #333; } /* 노란색 */

    </style>
</head>
<body>

    <h2>&lt;2026년 2분기&gt;</h2>

    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background-color: #e0e0e0;"></div>체크 안 함</div>
        <div class="legend-item"><div class="legend-color" style="background-color: #4caf50;"></div>좋은 날</div>
        <div class="legend-item"><div class="legend-color" style="background-color: #f44336;"></div>좋지 않은 날</div>
        <div class="legend-item"><div class="legend-color" style="background-color: #212121;"></div>패닉</div>
        <div class="legend-item"><div class="legend-color" style="background-color: #ff9800;"></div>일정 있음</div>
        <div class="legend-item"><div class="legend-color" style="background-color: #ffeb3b;"></div>별 일 없음</div>
    </div>

    <div class="grid" id="gridContainer"></div>

    <script>
        const totalDays = 91; // 7열 * 13행 = 91일 (2026년 4, 5, 6월의 총 일수와 동일)
        const storageKey = 'notion_q2_2026_tracker';
        
        // 상태는 0~5까지 순환
        // 0: 회색, 1: 초록, 2: 빨강, 3: 검정, 4: 주황, 5: 노랑
        
        // 저장된 데이터 불러오기
        let savedData = JSON.parse(localStorage.getItem(storageKey));
        if (!savedData || savedData.length !== totalDays) {
            savedData = Array(totalDays).fill(0);
        }

        const gridContainer = document.getElementById('gridContainer');

        // 그리드 생성
        for (let i = 0; i < totalDays; i++) {
            const cell = document.createElement('div');
            cell.className = `cell state-${savedData[i]}`;
            cell.textContent = i + 1; // 일수 표시 (1~91)

            // 클릭 이벤트 (상태 변경)
            cell.addEventListener('click', () => {
                // 다음 상태로 변경 (0 -> 1 -> 2 -> 3 -> 4 -> 5 -> 0...)
                savedData[i] = (savedData[i] + 1) % 6;
                
                // 클래스 업데이트
                cell.className = `cell state-${savedData[i]}`;
                
                // 로컬 스토리지에 즉시 저장
                localStorage.setItem(storageKey, JSON.stringify(savedData));
            });

            gridContainer.appendChild(cell);
        }
    </script>

</body>
</html>
